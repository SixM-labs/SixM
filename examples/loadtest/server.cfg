# Load test server. Run from this folder: cargo run --release -p sixm-server
# Then start the swarm from the repository root, and type `perf` here.
set sv_hostname "SixM Load Test"

# The swarm connects this many players at once. The default limit is 32.
set sv_maxclients 128

# Server-owned vehicles created by the loadtest resource.
set loadtest_vehicles 500

ensure loadtest
