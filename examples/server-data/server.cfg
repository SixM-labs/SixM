# Example server. Run from this folder: cargo run -p sixm-server
set sv_hostname "SixM Example Server"
sixm_tickRate 20

# Remote console is disabled by default. Configure a private password to enable it.
# set rcon_password "<private-password>"

# Replicated to every client: client scripts read it with GetConvar.
setr game_mode "freeroam"

# Licenses the queue resource refuses, comma separated.
set queue_banned ""

# Permissions. Players can use the example chat. To make yourself an admin, copy the
# license the server logs when you join (or from `players`) and uncomment:
# add_principal identifier.license:<your license> group.admin
add_ace group.admin command allow
add_ace builtin.everyone command.say allow

# Mapmanager changes resources through the same ACE-checked lifecycle natives.
add_ace resource.mapmanager command.start allow
add_ace resource.mapmanager command.stop allow
add_ace resource.mapmanager command.restart allow

ensure sessionmanager
ensure baseevents
ensure spawnmanager
ensure mapmanager
ensure chat

ensure greeter
ensure hello
ensure queue
ensure garage

# Optional SQLite demo. Enable both lines to persist a startup count in data/.
# set mysql_connection_string "sqlite://data/sixm-demo.db"
# ensure db_demo
