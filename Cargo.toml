[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "GPL-3.0-only"

[workspace.dependencies]
sixm-core = { path = "crates/sixm-core" }
sixm-resources = { path = "crates/sixm-resources" }
sixm-lua = { path = "crates/sixm-lua" }

mlua = { version = "0.12.3", features = ["lua54", "vendored"] }
globset = "0.4.22"
walkdir = "2.5.1"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serde_json = "1.0.154"
ctrlc = { version = "3.5.3", features = ["termination"] }
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
