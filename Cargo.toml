[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fuzz"]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
publish = false
license = "GPL-3.0-only"

[workspace.dependencies]
sixm-core = { path = "crates/sixm-core" }
sixm-resources = { path = "crates/sixm-resources" }
sixm-lua = { path = "crates/sixm-lua" }
sixm-js = { path = "crates/sixm-js" }
sixm-net = { path = "crates/sixm-net" }
sixm-kvp = { path = "crates/sixm-kvp" }
sixm-client = { path = "crates/sixm-client" }

mlua = { version = "0.12.3", features = ["lua54", "vendored"] }
rquickjs = { version = "0.14", default-features = false, features = ["std", "macro"] }
globset = "0.4.22"
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
walkdir = "2.5.1"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serde_json = "1.0.154"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.14.10"
ring = "0.17.14"
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "fs", "io-util"] }
postcard = { version = "1.2.0", features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
ctrlc = { version = "3.5.3", features = ["termination"] }
tempfile = "3.27.0"
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
